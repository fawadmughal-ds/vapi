# Alembic configuration for the NextCall backend.
#
# The database URL is NOT hard-coded here; env.py reads it from the app settings
# (i.e. the DATABASE_URL environment variable) so migrations use the exact same
# connection string as the running application.
#
# Usage:
#   cd backend
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
